<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1d292b" />
    <meta name="description" content="A compact view of your time in progress." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="stylesheet" href="./widget.css?v=6" />
    <title>Compact view · Life in Progress</title>
  </head>
  <body>
    <main class="compact-card">
      <header class="compact-header">
        <span class="brand"><span class="brand-sun" aria-hidden="true"></span> life in progress</span>
        <a class="full-link" href="./index.html" aria-label="Open full Life in Progress app">Full app <span aria-hidden="true">↗</span></a>
      </header>

      <section class="time-panel" aria-label="Time progress">
        <p class="eyebrow" id="period-name">TODAY</p>
        <h1 id="remaining">—</h1>
        <p class="remaining-label" id="remaining-label">remaining</p>
        <div class="progress-track" id="progress-track" role="progressbar" aria-label="Time elapsed" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="progress-fill"></span></div>
        <div class="progress-meta"><span id="progress-percent">—</span><span>elapsed</span></div>
      </section>

      <div class="controls">
        <label><span>TIME PERIOD</span><select id="period-select" aria-label="Compact view time period"><option value="today">Today</option><option value="month">This month</option><option value="year">This year</option><option value="life">My life</option></select></label>
        <label><span>TIME UNIT</span><select id="unit-select" aria-label="Compact view time unit"><option value="years">Years</option><option value="months">Months</option><option value="days">Days</option><option value="hours">Hours</option><option value="minutes">Minutes</option><option value="seconds">Seconds</option></select></label>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="./widget.js?v=6"></script>
  </body>
</html>
