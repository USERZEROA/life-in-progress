<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f2ec" />
    <meta name="description" content="A compact view of your time and three simple meal ideas." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./styles.css?v=6" />
    <title>Life in Progress</title>
  </head>
  <body>
    <main class="app-stage">
      <h1 class="visually-hidden">Life in Progress</h1>
      <section class="progress-card" aria-label="Life in Progress">
        <header class="card-header">
          <div class="brand" aria-label="Life in Progress">
            <span class="brand-mark" aria-hidden="true"></span>
            <span>life in progress<span class="brand-dot">.</span></span>
          </div>
          <div class="header-actions">
            <button class="icon-button" id="open-widget-btn" type="button" aria-label="Open compact window" title="Open compact window">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="M3.5 9.5h17"/></svg>
            </button>
            <button class="icon-button" id="settings-btn" type="button" aria-label="Open settings" title="Settings">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3.3 13.4 5l2.2.5 2-1 1.7 1.7-1 2 .5 2.2 1.9 1.4v2.4l-1.9 1.4-.5 2.2 1 2-1.7 1.7-2-1-2.2.5-1.4 1.9H9.6L8.2 21l-2.2-.5-2 1-1.7-1.7 1-2-.5-2.2L1 14.2v-2.4l1.8-1.4.5-2.2-1-2L4 4.5l2 1L8.2 5l1.4-1.7H12Z" transform="translate(1 -1) scale(.92)"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </header>

        <div class="card-content">
          <section class="life-panel" aria-label="Time progress">
            <label class="visually-hidden" for="period-select">Time period</label>
            <select id="period-select" class="period-select">
              <option value="today">Today</option>
              <option value="month">This Month</option>
              <option value="year">This Year</option>
              <option value="life">My Life</option>
            </select>

            <div class="progress-value" id="hero-percent" aria-live="off">—</div>
            <div class="progress-track" id="hero-progress-track" role="progressbar" aria-label="Time elapsed" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div class="progress-fill" id="hero-progress-fill"></div>
            </div>

            <div class="remaining-block">
              <div class="remaining-display">
                <strong id="hero-remaining">—</strong>
                <span id="hero-remaining-unit">hours</span>
                <span class="remaining-label">remaining</span>
              </div>
              <label class="visually-hidden" for="unit-select">Remaining time unit</label>
              <select id="unit-select" class="unit-select" aria-label="Remaining time unit">
                <option value="years">Years</option>
                <option value="months">Months</option>
                <option value="days">Days</option>
                <option value="hours" selected>Hours</option>
                <option value="minutes">Minutes</option>
                <option value="seconds">Seconds</option>
              </select>
            </div>
          </section>

          <section class="meals-panel" aria-label="Meal recommendations">
            <div class="meals-top">
              <span class="panel-label">Meals today</span>
              <button class="refresh-button" id="refresh-meals-btn" type="button" aria-label="Get new meal ideas" title="Get new meal ideas">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.7 9a7 7 0 0 1 12.1-2L20 12M4 12l2.2 5A7 7 0 0 0 18.3 15"/></svg>
              </button>
            </div>
            <div class="meal-list">
              <div class="meal-row"><span class="meal-marker" aria-hidden="true"></span><span class="meal-type">Breakfast</span><strong class="meal-name" id="meal-breakfast">—</strong></div>
              <div class="meal-row"><span class="meal-marker" aria-hidden="true"></span><span class="meal-type">Lunch</span><strong class="meal-name" id="meal-lunch">—</strong></div>
              <div class="meal-row"><span class="meal-marker" aria-hidden="true"></span><span class="meal-type">Dinner</span><strong class="meal-name" id="meal-dinner">—</strong></div>
            </div>
          </section>
        </div>
      </section>
    </main>

    <dialog class="app-dialog profile-dialog" id="profile-dialog" aria-labelledby="profile-dialog-title">
      <div class="dialog-head">
        <div>
          <p class="dialog-kicker" id="setup-progress"></p>
          <h2 id="profile-dialog-title">Your details</h2>
        </div>
        <button class="close-button" type="button" data-close="profile-dialog" aria-label="Close settings">×</button>
      </div>
      <form id="profile-form">
        <section class="form-step" data-step="1">
          <h3>Life progress</h3>
          <div class="form-grid">
            <label class="full-width"><span>Your name <small>Optional</small></span><input id="profile-name" name="name" type="text" maxlength="40" autocomplete="given-name" placeholder="What should we call you?" /></label>
            <label><span>Birthday</span><input id="profile-birthday" name="birthday" type="date" required /></label>
            <label><span>How many years do you plan to live?</span><input id="profile-lifespan" name="expectedLifespan" type="number" min="1" max="130" step="1" value="90" required /></label>
          </div>
        </section>
        <section class="form-step" data-step="2">
          <h3>Make it yours</h3>
          <div class="form-grid">
            <label><span>Zodiac sign</span><select id="profile-zodiac" name="zodiac"><option value="">Use birthday</option><option>Aries</option><option>Taurus</option><option>Gemini</option><option>Cancer</option><option>Leo</option><option>Virgo</option><option>Libra</option><option>Scorpio</option><option>Sagittarius</option><option>Capricorn</option><option>Aquarius</option><option>Pisces</option></select></label>
            <label><span>MBTI type</span><select id="profile-mbti" name="mbti"><option value="">Choose a type</option><option>INTJ</option><option>INTP</option><option>ENTJ</option><option>ENTP</option><option>INFJ</option><option>INFP</option><option>ENFJ</option><option>ENFP</option><option>ISTJ</option><option>ISFJ</option><option>ESTJ</option><option>ESFJ</option><option>ISTP</option><option>ISFP</option><option>ESTP</option><option>ESFP</option></select></label>
            <label><span>Food style</span><select id="profile-diet" name="diet"><option value="any">Anything</option><option value="vegetarian">Vegetarian</option><option value="vegan">Vegan</option></select></label>
            <label><span>Favorite cuisine</span><select id="profile-cuisine" name="cuisine"><option value="any">Open to anything</option><option value="asian">Asian-inspired</option><option value="mediterranean">Mediterranean</option><option value="american">American comfort</option><option value="mexican">Mexican-inspired</option></select></label>
            <label class="full-width"><span>Foods to avoid or dislike <small>Separate with commas</small></span><input id="profile-disliked" name="dislikedIngredients" type="text" maxlength="250" placeholder="e.g. mushrooms, dairy" /></label>
          </div>
        </section>
        <section class="form-step" data-step="3">
          <div class="section-row">
            <h3>Important moments</h3>
            <button class="text-button" id="add-event-btn" type="button">+ Add event</button>
          </div>
          <div class="moment-list" id="moment-list"></div>
          <div class="settings-utilities">
            <p>Your details are stored in this browser.</p>
            <div class="data-actions">
              <button class="text-button" id="export-btn" type="button">Export JSON</button>
              <button class="text-button" id="import-btn" type="button">Import JSON</button>
              <button class="text-button" id="install-btn" type="button">Install app</button>
              <input id="import-file" type="file" accept="application/json,.json" hidden />
            </div>
          </div>
        </section>
        <div class="dialog-actions">
          <button class="secondary-button edit-only" type="button" data-close="profile-dialog">Cancel</button>
          <button class="secondary-button setup-only" id="step-back" type="button">Back</button>
          <button class="primary-button setup-only" id="step-next" type="button">Continue</button>
          <button class="primary-button" id="profile-save" type="submit">Save</button>
        </div>
      </form>
    </dialog>

    <dialog class="app-dialog event-dialog" id="event-dialog" aria-labelledby="event-dialog-title">
      <div class="dialog-head">
        <h2 id="event-dialog-title">Add event</h2>
        <button class="close-button" type="button" data-close="event-dialog" aria-label="Close event">×</button>
      </div>
      <form id="event-form">
        <input id="event-id" type="hidden" />
        <div class="form-grid">
          <label class="full-width"><span>Event title</span><input id="event-title" type="text" maxlength="80" required placeholder="A day you want to remember" /></label>
          <label class="full-width"><span>Date</span><input id="event-date" type="date" required /></label>
          <label class="full-width"><span>Note <small>Optional</small></span><textarea id="event-note" rows="3" maxlength="280" placeholder="What made this day meaningful?"></textarea></label>
        </div>
        <div class="dialog-actions">
          <button class="secondary-button" type="button" data-close="event-dialog">Cancel</button>
          <button class="primary-button" type="submit">Save event</button>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./app.js?v=6"></script>
  </body>
</html>
